[package]
name = "panamax"
version = "2.0.0"
authors = ["k3d3 <k@3d3.ca>"]
description = "Mirror rustup and crates.io repositories, for offline Rust and Cargo usage."
license = "MIT OR Apache-2.0"
readme = "README.md"
repository = "https://github.com/mvdschee/panamax"
publish = false
edition = "2024"

[dependencies]
reqwest = { version = "0.13.5", features = ["blocking"] }
indicatif = "0.18.6"
clap = { version = "4.6.7", features = ["derive"] }
serde = { version = "1.0.229", features = ["derive"] }
console = "0.16.6"
sha2 = "0.11.1"
url = "2.5.8"
glob = "0.3.4"
semver = "1.0.28"
serde_json = "1.0.154"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["full"] }
askama = "0.16.1"
axum = "0.8.9"
tower-http = { version = "0.7.1", features = ["fs"] }
bytes = "1"
futures = "0.3.34"
walkdir = "2.5.0"
toml_edit = "0.25.17"
toml = "1.1.8"
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }

[features]
default = []

[dev-dependencies]
tempfile = "3.27.0"
