[package]
name = "panamax"
version = "1.0.14"
authors = ["k3d3 <k@3d3.ca>"]
description = "Mirror rustup and crates.io repositories, for offline Rust and Cargo usage."
license = "MIT OR Apache-2.0"
readme = "README.md"
repository = "https://github.com/mvdschee/panamax"
publish = false
edition = "2024"

[dependencies]
reqwest = { version = "0.13.5", features = ["blocking"] }
indicatif = "0.18.6"
clap = { version = "4.6.7", features = ["derive"] }
serde = { version = "1.0.229", features = ["derive"] }
console = "0.16.6"
log = "0.4.35"
env_logger = "0.11.11"
sha2 = "0.11.1"
url = "2.5.8"
glob = "0.3.4"
git2 = { version = "0.21.0", features = ["https"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["full"] }
warp = { version = "0.3.7", features = ["tls"] }
askama = "0.16.1"
include_dir = "0.7.4"
bytes = "1"
tokio-stream = "0.1"
tokio-util = { version = "0.7.20", features = ["codec"] }
futures-util = "0.3.34"
futures = "0.3.34"
walkdir = "2.5.0"
toml_edit = "0.25.17"
toml = "1.1.8"

[features]
default = []
dev_reduced_crates = []
vendored-openssl = ["git2/vendored-openssl"]
