name: ci

on:
   push:
      branches:
         - "**"

env:
   CARGO_TERM_COLOR: always

jobs:
   check:
      name: check
      runs-on: ubuntu-latest
      permissions:
         contents: read

      steps:
         - name: Checkout
           uses: actions/checkout@v7.0.1

         # rustup installs the toolchain from rust-toolchain.toml on first use
         - name: Install toolchain
           run: rustup toolchain install

         - name: Cache cargo
           uses: Swatinem/rust-cache@v2.9.3

         - name: Format
           run: cargo fmt --check

         - name: Clippy
           run: cargo clippy --all-targets -- -D warnings

         - name: Test
           run: cargo test

   docker:
      name: docker (${{ matrix.platform }})
      runs-on: ${{ matrix.runner }}
      permissions:
         contents: read
      strategy:
         fail-fast: false
         matrix:
            include:
               - platform: linux/amd64
                 runner: ubuntu-latest
               - platform: linux/arm64
                 runner: ubuntu-24.04-arm

      steps:
         - name: Checkout
           uses: actions/checkout@v7.0.1

         - name: Set up Docker Buildx
           uses: docker/setup-buildx-action@v4.4.1

         - name: Build image
           uses: docker/build-push-action@v7.4.0
           with:
              context: .
              file: .docker/Dockerfile
              platforms: ${{ matrix.platform }}
              cache-from: type=gha,scope=${{ matrix.platform }}
              cache-to: type=gha,scope=${{ matrix.platform }},mode=max
              load: true
              tags: panamax:test

         - name: Run image
           run: |
              docker run --rm panamax:test --help | grep -q serve
              docker run --rm --entrypoint git panamax:test --version
